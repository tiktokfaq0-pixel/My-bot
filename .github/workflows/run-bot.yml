name: Run Telegram PDF Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      MAX_FILE_MB: 20
      LOG_LEVEL: INFO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LibreOffice and font tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice fontconfig curl
          sudo mkdir -p /usr/local/share/fonts
          sudo curl -L --fail -o /usr/local/share/fonts/Pyidaungsu.ttf https://raw.githubusercontent.com/AungMyoKyaw/Myanmar-Unicode-Fonts/master/Pyidaungsu/pyidaungsu-1.3.ttf
          sudo fc-cache -f -v

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Check secret exists
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "BOT_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Start bot
        run: python bot.py

